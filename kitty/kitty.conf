# ╔══════════════════════════════════════════════════════════════╗
# ║                    Kitty Configuration                      ║
# ║              A clean, fast, developer-friendly setup        ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Fonts ─────────────────────────────────────────────────────
font_family        JetBrainsMono Nerd Font
bold_font          JetBrainsMono Nerd Font Bold
italic_font        JetBrainsMono Nerd Font Italic
bold_italic_font   JetBrainsMono Nerd Font Bold Italic
font_size          13.0
disable_ligatures  never

# ── Cursor ────────────────────────────────────────────────────
cursor_shape           beam
cursor_beam_thickness  1.5
cursor_blink_interval  0.5
cursor_stop_blinking_after 15.0

# ── Scrollback ────────────────────────────────────────────────
scrollback_lines       10000
scrollback_pager       less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ── Mouse ─────────────────────────────────────────────────────
mouse_hide_wait        3.0
url_style              curly
open_url_with          default
copy_on_select         yes
strip_trailing_spaces  smart

# ── Performance ───────────────────────────────────────────────
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# ── Bell ──────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab          "🔔 "

# ── Window Layout ─────────────────────────────────────────────
remember_window_size   yes
initial_window_width   120c
initial_window_height  36c
window_padding_width   8 12
placement_strategy     center
hide_window_decorations no
confirm_os_window_close 0

# ── Tab Bar ───────────────────────────────────────────────────
tab_bar_edge         bottom
tab_bar_style        powerline
tab_powerline_style  slanted
tab_bar_min_tabs     2
tab_title_template   " {index}: {title} "
active_tab_title_template " {index}: {title} "

# ── OS Specific ───────────────────────────────────────────────
macos_option_as_alt       yes
macos_quit_when_last_window_closed yes
macos_show_window_title_in window
linux_display_server      auto

# ── Shell Integration ─────────────────────────────────────────
shell_integration enabled
allow_hyperlinks  yes

# ══════════════════════════════════════════════════════════════
# ║                  Tokyo Night Color Scheme                  ║
# ══════════════════════════════════════════════════════════════

# Background & Foreground
foreground              #a9b1d6
background              #1a1b26
background_opacity      0.99
background_blur         20
selection_foreground     #1a1b26
selection_background     #33467c

# Cursor
cursor                  #c0caf5
cursor_text_color       #1a1b26

# URL
url_color               #73daca

# Tab Bar
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
inactive_tab_foreground #545c7e
inactive_tab_background #292e42
tab_bar_background      #15161e

# Normal Colors (0-7)
color0   #15161e
color1   #f7768e
color2   #9ece6a
color3   #e0af68
color4   #7aa2f7
color5   #bb9af7
color6   #7dcfff
color7   #a9b1d6

# Bright Colors (8-15)
color8   #414868
color9   #f7768e
color10  #9ece6a
color11  #e0af68
color12  #7aa2f7
color13  #bb9af7
color14  #7dcfff
color15  #c0caf5

# Extended Colors
mark1_foreground #1a1b26
mark1_background #7aa2f7
mark2_foreground #1a1b26
mark2_background #9ece6a
mark3_foreground #1a1b26
mark3_background #f7768e

# ══════════════════════════════════════════════════════════════
# ║                     Key Bindings                           ║
# ══════════════════════════════════════════════════════════════

# ── Clipboard ─────────────────────────────────────────────────
map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard

# ── Font Size ─────────────────────────────────────────────────
map ctrl+equal    change_font_size all +1.0
map ctrl+minus    change_font_size all -1.0
map ctrl+0        change_font_size all 0

# ── Windows ───────────────────────────────────────────────────
map ctrl+shift+enter  new_window_with_cwd
map ctrl+shift+w      close_window
map ctrl+shift+]      next_window
map ctrl+shift+[      previous_window
map ctrl+shift+f      move_window_forward
map ctrl+shift+b      move_window_backward

# ── Tabs ──────────────────────────────────────────────────────
map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+q      close_tab
map ctrl+shift+right  next_tab
map ctrl+shift+left   previous_tab
map ctrl+shift+.      move_tab_forward
map ctrl+shift+,      move_tab_backward
map ctrl+shift+alt+t  set_tab_title

# Quick tab switching
map ctrl+1  goto_tab 1
map ctrl+2  goto_tab 2
map ctrl+3  goto_tab 3
map ctrl+4  goto_tab 4
map ctrl+5  goto_tab 5

# ── Layouts ───────────────────────────────────────────────────
enabled_layouts      tall:bias=60, fat:bias=60, horizontal, vertical, stack
map ctrl+shift+l     next_layout
map ctrl+shift+z     toggle_layout stack

# ── Scrolling ─────────────────────────────────────────────────
map ctrl+shift+up     scroll_line_up
map ctrl+shift+down   scroll_line_down
map ctrl+shift+k      scroll_line_up
map ctrl+shift+j      scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home   scroll_home
map ctrl+shift+end    scroll_end
map ctrl+shift+h      show_scrollback

# ── Misc ──────────────────────────────────────────────────────
map ctrl+shift+f5     load_config_file
map ctrl+shift+f6     debug_config
map ctrl+shift+u      kitten unicode_input
map ctrl+shift+e      open_url_with_hints
map ctrl+shift+f2     edit_config_file
